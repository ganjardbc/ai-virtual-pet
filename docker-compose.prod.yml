services:
  postgres:
    image: postgres:16-alpine
    container_name: aivpet-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aivpet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ai_virtual_pet}
    volumes:
      - aivpet_postgres_data:/var/lib/postgresql/data
    ports:
      - "5450:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aivpet} -d ${POSTGRES_DB:-ai_virtual_pet}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: aivpet-api-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - apps/api/.env
    ports:
      - "3032:3000"
    networks:
      - default
      - nginx-proxy-manager

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # The debug button is compiled into the bundle, so it must match the API's flag.
        ENABLE_DEBUG_API: ${AIVPET_DEBUG:-false}
    container_name: aivpet-web-prod
    restart: always
    depends_on:
      - api
    ports:
      - "8083:8080"
    networks:
      - default
      - nginx-proxy-manager

volumes:
  aivpet_postgres_data:

networks:
  nginx-proxy-manager:
    external: true
    name: nginx-proxy-manager_default
